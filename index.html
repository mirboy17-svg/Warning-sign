            const firstAidSection = fullText.substring(0, 15000).match(/4\.\s*응급조치\s*요령([\s\S]+?)(?:5\.\s*폭발\s*|\n5\.)/i);
            if (firstAidSection && firstAidSection[1]) {
                const faText = firstAidSection[1];
                if (faText.includes('콘택트렌즈')) eye += "\n- 콘택트렌즈를 낀 경우 빼시오.";
                if (faText.includes('토하게')) ingest += "\n- 억지로 토하게 하지 마시오.";
                if (faText.includes('인공호흡')) inhale += "\n- 호흡하지 않는 경우 인공호흡을 실시하시오.";
                if (faText.includes('해독제')) doctor += "\n- 특정한 해독제를 투여하시오.";
            }

            if (fullText.match(/물\s*분무\s*금지|주수\s*금지/i) || uniqueCodes.includes('H260') || uniqueCodes.includes('H261')) extinguish = "건조한 모래, 금속화재용 분말 (절대 주수 금지)";
            if (fullText.match(/모래|흙/i)) leakResponse = "적절한 보호구를 착용하고, 누출물을 건조한 모래나 흙으로 덮어 수거할 것";

            return {
                processName: "", 
                revisionDate, productName, signalWord, pictograms, 
                hazardsText, handlingText,
                firstAidData: { eye, skin, inhale, ingest, doctor, extinguish, leakResponse },
                supplierInfo, labelHazards, labelPrevention
            };
        };

        const MSDSPlatform = () => {
            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [uploadedFiles, setUploadedFiles] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [dragActive, setDragActive] = useState(false);
            const fileInputRef = useRef(null);
            
            // 다중 파일 관리를 위한 상태 정의 (activeFileId 에러 해결 부분)
            const [fileDataMap, setFileDataMap] = useState({});
            const [activeFileId, setActiveFileId] = useState(null);
            
            const [companyLogo, setCompanyLogo] = useState(null);
            const logoInputRef = useRef(null);

            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: '', title: '', content: '' });

            // 현재 선택된 탭의 파일 데이터
            const activeData = fileDataMap[activeFileId] || null;

            const handleFiles = async (files) => {
                if (!files || files.length === 0) return;
                
                const filesArray = Array.from(files).slice(0, 10);
                
                let newFileEntries = filesArray.map(f => ({
                    id: Math.random().toString(36).substring(7), 
                    name: f.name, 
                    size: (f.size / 1024 / 1024).toFixed(2) + ' MB', 
                    status: 'pending',
                    file: f
                }));

                setUploadedFiles(prev => {
                    const combined = [...prev, ...newFileEntries];
                    return combined.slice(0, 10);
                });
                
                setIsProcessing(true);

                if (!activeFileId && newFileEntries.length > 0) {
                    setActiveFileId(newFileEntries[0].id);
                }

                for (let fileEntry of newFileEntries) {
                    const file = fileEntry.file;
                    try {
                        let extractedText = "";
                        if (file.type === 'application/pdf' && window.pdfjsLib) {
                            const arrayBuffer = await file.arrayBuffer();
                            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                extractedText += textContent.items.map(item => item.str).join(" ") + "\n";
                            }
                        } else {
                            extractedText = await file.text();
                        }
                        const parsed = parseTextToMSDS(extractedText, file.name);
                        parsed.selectedPPE = ['301', '302', '309', '308']; // 기본 보호구 세팅

                        setFileDataMap(prev => ({
                            ...prev,
                            [fileEntry.id]: parsed
                        }));
                        
                        setUploadedFiles(prev => prev.map(f => f.id === fileEntry.id ? { ...f, status: 'complete' } : f));
                    } catch (error) {
                        console.error(error);
                        setUploadedFiles(prev => prev.map(f => f.id === fileEntry.id ? { ...f, status: 'error' } : f));
                    }
                }
                
                setIsProcessing(false);
                setActiveMenu(prev => prev === 'dashboard' ? 'management' : prev);
            };

            const handleDrag = (e) => { e.preventDefault(); e.stopPropagation(); setDragActive(e.type === "dragenter" || e.type === "dragover"); };
            const handleDrop = (e) => { e.preventDefault(); e.stopPropagation(); setDragActive(false); if (e.dataTransfer.files && e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files); };
            const handleChange = (e) => { e.preventDefault(); if (e.target.files && e.target.files.length > 0) handleFiles(e.target.files); };
            
            const removeFile = (id) => { 
                setUploadedFiles(prev => {
                    const updated = prev.filter(f => f.id !== id);
                    if (activeFileId === id) {
                        setActiveFileId(updated.length > 0 ? updated[0].id : null);
                    }
                    return updated;
                }); 
                setFileDataMap(prev => {
                    const newMap = { ...prev };
                    delete newMap[id];
                    return newMap;
                });
            };

            const updateActiveFileData = (newData) => {
                if (!activeFileId) return;
                setFileDataMap(prev => ({
                    ...prev,
                    [activeFileId]: { ...prev[activeFileId], ...newData }
                }));
            };

            const updateFirstAid = (key, value) => {
                if (!activeFileId) return;
                setFileDataMap(prev => {
                    const currentData = prev[activeFileId];
                    return { ...prev, [activeFileId]: { ...currentData, firstAidData: { ...currentData.firstAidData, [key]: value } } };
                });
            };

            const togglePictogram = (type) => {
                if (!activeFileId) return;
                setFileDataMap(prev => {
                    const currentData = prev[activeFileId];
                    let newPics = currentData.pictograms.includes(type) ? currentData.pictograms.filter(p => p !== type) : [...currentData.pictograms, type];
                    return { ...prev, [activeFileId]: { ...currentData, pictograms: newPics } };
                });
            };

            const togglePPE = (id) => {
                if (!activeFileId) return;
                setFileDataMap(prev => {
                    const currentData = prev[activeFileId];
                    const ppeList = currentData.selectedPPE || [];
                    let newPPE = ppeList.includes(id) ? ppeList.filter(ppeId => ppeId !== id) : [...ppeList, id];
                    return { ...prev, [activeFileId]: { ...currentData, selectedPPE: newPPE } };
                });
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setCompanyLogo(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const openModal = (type, title, content) => setModalConfig({ isOpen: true, type, title, content });
            const closeModal = () => setModalConfig({ ...modalConfig, isOpen: false });
            const saveModal = (newContent) => {
                if (modalConfig.type === 'hazards') updateActiveFileData({ labelHazards: newContent });
                else if (modalConfig.type === 'prevention') updateActiveFileData({ labelPrevention: newContent });
                closeModal();
            };

            const formatTruncatedText = (text, limit = 6) => {
                if (!text) return '';
                const lines = text.split('\n').filter(l => l.trim() !== '');
                if (lines.length > limit) return lines.slice(0, limit).join('\n') + '\n... (이하 생략)';
                return lines.join('\n');
            };

            const renderLabelContent = (data, isMaster = false, isSmall = false) => {
                const pics = data.pictograms.slice(0, 4);
                
                if (isSmall) {
                    return (
                        <div className={`w-full h-full border-[1.5px] border-black flex flex-col bg-white overflow-hidden ${isMaster ? 'shadow-sm rounded-md' : ''}`}>
                            {/* 1. 명칭 및 신호어 영역 (상하 배치로 변경하여 가로 폭 잘림 원천 방지) */}
                            <div className="flex flex-col h-[34%] shrink-0">
                                <div className="h-[55%] border-b-[1.5px] border-black flex flex-col items-center justify-center relative px-1 bg-white">
                                    <span className="absolute left-1 top-0.5 text-[5px] font-bold text-slate-600">(명 칭)</span>
                                    {isMaster ? (
                                        <input type="text" value={data.productName} onChange={e => updateActiveFileData({ productName: e.target.value })} className="w-[90%] text-center text-[11px] font-extrabold bg-transparent outline-none border-b border-dashed border-blue-400 mt-2" />
                                    ) : (
                                        <span className="text-[10px] font-extrabold truncate w-[95%] text-center tracking-tight leading-none mt-2">{data.productName}</span>
                                    )}
                                </div>
                                <div className="h-[45%] border-b-[1.5px] border-black flex flex-col items-center justify-center relative px-1 bg-white">
                                    <span className="absolute left-1 top-0.5 text-[5px] font-bold text-slate-600">(신호어)</span>
                                    {isMaster ? (
                                        <input type="text" value={data.signalWord} onChange={e => updateActiveFileData({ signalWord: e.target.value })} className="w-[90%] text-center text-[#c00000] font-black text-[11px] bg-transparent outline-none border-b border-dashed border-red-400 mt-1.5" />
                                    ) : (
                                        <span className="text-[#c00000] font-black text-[11px] leading-none mt-1.5">{data.signalWord}</span>
                                    )}
                                </div>
                            </div>
                            
                            {/* 2. 그림문자 영역 (간격 및 크기 최대화) */}
                            <div className="flex-1 border-b-[1.5px] border-black flex flex-col items-center justify-center shrink-0 p-1 relative bg-white min-h-0">
                                <span className="absolute top-0.5 left-1 text-[5px] font-bold text-slate-600">(그림문자)</span>
                                
                                <div className="w-[90%] h-[85%] mt-3 grid grid-cols-2 grid-rows-2 gap-[2px] place-items-center">
                                    {pics.map((pic, idx) => (
                                        <div key={idx} className="w-full h-full flex items-center justify-center p-[1px]">
                                            {renderGHS(pic)}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            {/* 3. 공급자 정보 영역 */}
                            <div className="h-[20%] w-full flex flex-row items-center justify-between relative px-1.5 shrink-0 bg-white">
                                <span className="absolute left-1 top-0.5 text-[5px] font-bold text-slate-600 z-10">(공급자 정보)</span>
                                <div className="flex-1 flex justify-center items-center h-full pt-1.5 overflow-hidden">
                                    {isMaster ? (
                                        <input type="text" value={data.supplierInfo} onChange={e => updateActiveFileData({ supplierInfo: e.target.value })} className="w-full text-center text-[7.5px] font-bold bg-transparent outline-none border-b border-dashed border-blue-400" />
                                    ) : (
                                        <span className="text-[7.5px] font-bold leading-tight text-center text-slate-800 overflow-hidden text-ellipsis whitespace-nowrap w-full">{data.supplierInfo}</span>
                                    )}
                                </div>
                                {companyLogo && (
                                    <div className="h-[60%] shrink-0 ml-1 pt-1.5 flex justify-end">
                                        <img src={companyLogo} alt="logo" className="h-full max-w-[25px] object-contain object-right" />
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className={`w-full h-full border-[1.5px] border-black flex flex-col bg-white overflow-hidden ${isMaster ? 'shadow-sm rounded-md' : ''}`}>
                        <div className="h-[18%] border-b-[1.5px] border-black flex bg-slate-50 shrink-0">
                            <div className="flex-1 border-r-[1.5px] border-black flex flex-col items-center justify-center relative px-1">
                                <span className="absolute left-1 top-0.5 text-[6px] font-bold text-slate-500">(명 칭)</span>
                                {isMaster ? (
                                    <input type="text" value={data.productName} onChange={e => updateActiveFileData({ productName: e.target.value })} className="w-[90%] text-center text-[14px] font-extrabold bg-transparent outline-none border-b border-dashed border-blue-400 mt-2" />
                                ) : (
                                    <span className="text-[13px] font-extrabold truncate w-[90%] text-center tracking-tight leading-none mt-1">{data.productName}</span>
                                )}
                            </div>
                            
                            <div className="w-[28%] flex flex-col items-center justify-center relative px-1 bg-white">
                                <span className="absolute left-1 top-0.5 text-[6px] font-bold text-slate-500">(신호어)</span>
                                {isMaster ? (
                                    <input type="text" value={data.signalWord} onChange={e => updateActiveFileData({ signalWord: e.target.value })} className="w-[90%] text-center text-[#c00000] font-black text-[13px] bg-transparent outline-none border-b border-dashed border-red-400 mt-2" />
                                ) : (
                                    <span className="text-[#c00000] font-black text-[13px] leading-none mt-1">{data.signalWord}</span>
                                )}
                            </div>
                        </div>
                        
                        <div className="flex flex-1 min-h-0 flex-row">
                            <div className="w-[30%] border-r-[1.5px] border-black flex flex-col items-center justify-center shrink-0 p-1 relative bg-white">
                                <span className="absolute top-0.5 left-0.5 text-[6px] font-bold text-slate-500">(그림문자)</span>
                                <div className="flex flex-col justify-center items-center w-full h-full flex-1 min-h-0 mt-2 gap-[1px]">
                                    {pics.length === 2 ? (
                                        <>
                                            <div className="flex justify-center gap-[2px] w-full">
                                                <div className="w-[45%] aspect-square flex items-center justify-center">{renderGHS(pics[0])}</div>
                                                <div className="w-[45%] aspect-square flex items-center justify-center">{renderGHS(pics[1])}</div>
                                            </div>
                                            <div className="w-[45%] aspect-square opacity-0"></div>
                                        </>
                                    ) : pics.length === 3 ? (
                                        <>
                                            <div className="flex justify-center gap-[2px] w-full">
                                                <div className="w-[45%] aspect-square flex items-center justify-center">{renderGHS(pics[0])}</div>
                                                <div className="w-[45%] aspect-square flex items-center justify-center">{renderGHS(pics[1])}</div>
                                            </div>
                                            <div className="flex justify-center w-full">
                                                <div className="w-[45%] aspect-square flex items-center justify-center">{renderGHS(pics[2])}</div>
                                            </div>
                                        </>
                                    ) : pics.length === 1 ? (
                                        <div className="flex justify-center w-full">
                                            <div className="w-[60%] aspect-square flex items-center justify-center">{renderGHS(pics[0])}</div>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-[1px] w-full place-items-center">
                                            {pics.map((pic, idx) => (
                                                <div key={idx} className="w-[85%] aspect-square flex items-center justify-center">{renderGHS(pic)}</div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                            
                            <div className="w-[70%] p-1.5 flex flex-col gap-1 overflow-hidden bg-white">
                                <div className="flex-1 overflow-hidden flex min-h-0 gap-1 group relative rounded border border-transparent hover:border-slate-200 transition-colors pt-1">
                                    <div className="text-[8.5px] font-extrabold shrink-0 w-16 text-slate-800">유해·위험 문구:</div>
                                    <div className="overflow-hidden flex-1 text-[7.5px] font-semibold leading-[1.2] whitespace-pre-wrap break-keep text-slate-700">
                                        {formatTruncatedText(data.labelHazards, 6)}
                                    </div>
                                    {isMaster && (
                                        <button onClick={() => openModal('hazards', '유해·위험 문구 편집', data.labelHazards)} className="absolute top-0 right-0 bg-blue-50 border border-blue-200 text-blue-700 px-2 py-0.5 text-[9px] rounded font-bold shadow-sm z-10 flex items-center gap-1 cursor-pointer hover:bg-blue-100 transition-colors">
                                            <IconLayout size={10}/> 자세히 보기/편집
                                        </button>
                                    )}
                                </div>

                                <div className="flex-1 overflow-hidden flex min-h-0 gap-1 group relative rounded border border-transparent hover:border-slate-200 transition-colors pt-1">
                                    <div className="text-[8.5px] font-extrabold shrink-0 w-16 text-slate-800">예방조치 문구:</div>
                                    <div className="overflow-hidden flex-1 text-[7.5px] font-semibold leading-[1.2] whitespace-pre-wrap break-keep text-slate-700">
                                        {formatTruncatedText(data.labelPrevention, 6)}
                                    </div>
                                    {isMaster && (
                                        <button onClick={() => openModal('prevention', '예방조치 문구 편집', data.labelPrevention)} className="absolute top-0 right-0 bg-blue-50 border border-blue-200 text-blue-700 px-2 py-0.5 text-[9px] rounded font-bold shadow-sm z-10 flex items-center gap-1 cursor-pointer hover:bg-blue-100 transition-colors">
                                            <IconLayout size={10}/> 자세히 보기/편집
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                        
                        <div className="h-[14%] border-t-[1.5px] border-black flex items-center justify-between px-1.5 shrink-0 gap-1 bg-slate-50 w-full overflow-hidden">
                            <div className="flex items-center gap-1 flex-1 overflow-hidden h-full">
                                <div className="text-[8.5px] font-extrabold shrink-0 text-slate-800">공급자 정보:</div>
                                {isMaster ? (
                                    <input type="text" value={data.supplierInfo} onChange={e => updateActiveFileData({ supplierInfo: e.target.value })} className="w-full text-[8px] font-bold bg-transparent outline-none border-b border-dashed border-blue-400 whitespace-nowrap" />
                                ) : (
                                    <span className="text-[8px] font-bold leading-none whitespace-nowrap overflow-hidden text-ellipsis w-full text-left text-slate-700">{data.supplierInfo}</span>
                                )}
                            </div>
                            {companyLogo && (
                                <div className="h-[75%] shrink-0 ml-2 flex items-center justify-end">
                                    <img src={companyLogo} alt="logo" className="h-full max-w-[40px] object-contain object-right" />
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex fixed inset-0 w-full h-full bg-slate-100 text-slate-800 overflow-hidden">
                    <aside className="w-72 bg-white text-slate-600 border-r border-slate-200 flex flex-col h-full shadow-sm z-10 no-print shrink-0 transition-colors duration-300">
                        <div className="p-6 border-b border-slate-100 bg-slate-50/50">
                            <h2 className="text-xl font-black text-slate-800 flex items-center gap-2"><IconAlertTriangle className="text-blue-600" /> <span>MSDS AI Center</span></h2>
                            <p className="text-xs text-slate-500 mt-2 font-medium">고용노동부고시 제2026-26호 표준 탑재</p>
                        </div>
                        <nav className="flex-1 py-6 px-3 space-y-1.5">
                            <button onClick={() => setActiveMenu('dashboard')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all duration-300 ${activeMenu === 'dashboard' ? 'bg-blue-50 text-blue-700 font-bold border border-blue-100 shadow-sm' : 'hover:bg-slate-50 hover:text-slate-900 text-slate-500 font-medium'}`}>
                                <div className="flex items-center gap-3"><IconUploadCloud /><span className="font-medium">1. 파일 업로드 (홈)</span></div>
                            </button>
                            <button onClick={() => setActiveMenu('management')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all duration-300 ${activeMenu === 'management' ? 'bg-blue-50 text-blue-700 font-bold border border-blue-100 shadow-sm' : 'hover:bg-slate-50 hover:text-slate-900 text-slate-500 font-medium'}`}>
                                <div className="flex items-center gap-3"><IconFileText /><span className="font-medium">2. 공정별 관리요령 작성</span></div>
                            </button>
                            <button onClick={() => setActiveMenu('label_large')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all duration-300 ${activeMenu === 'label_large' ? 'bg-blue-50 text-blue-700 font-bold border border-blue-100 shadow-sm' : 'hover:bg-slate-50 hover:text-slate-900 text-slate-500 font-medium'}`}>
                                <div className="flex items-center gap-3"><IconLayout size={20} /><span className="font-medium">3. 경고표지 작성</span></div>
                            </button>
                            <button onClick={() => setActiveMenu('label_small')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all duration-300 ${activeMenu === 'label_small' ? 'bg-blue-50 text-blue-700 font-bold border border-blue-100 shadow-sm' : 'hover:bg-slate-50 hover:text-slate-900 text-slate-500 font-medium'}`}>
                                <div className="flex items-center gap-3"><IconLayout size={20} /><span className="font-medium">4. 경고표지 작성(소형)</span></div>
                            </button>
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                        <header className="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex flex-col justify-center px-8 no-print shrink-0 relative z-10 transition-colors duration-300">
                            <h1 className="text-lg font-bold">
                                {activeMenu === 'dashboard' && '화학물질(MSDS) 공정별 관리요령 및 경고표지 자동 생성 플랫폼'}
                                {activeMenu === 'management' && '2. 공정별 관리요령 작성 (A4 자동맞춤)'}
                                {activeMenu === 'label_large' && '3. 경고표지 작성 - 100ml 이상 (A4 1/10 마스터 편집 및 복제)'}
                                {activeMenu === 'label_small' && '4. 경고표지 작성 - 100ml 미만 (소형 마스터 편집 및 복제)'}
                            </h1>
                        </header>

                        {/* 상단 탭: 업로드된 파일 이동기 */}
                        {uploadedFiles.length > 0 && activeMenu !== 'dashboard' && (
                            <div className="w-full bg-slate-50 border-b border-slate-200 px-6 py-2.5 flex gap-2 overflow-x-auto no-print shrink-0 items-center shadow-sm z-10 custom-scrollbar">
                                <span className="text-xs font-bold text-slate-500 shrink-0 mr-2 flex items-center gap-1"><IconFileText size={14}/> 편집 중인 파일:</span>
                                {uploadedFiles.map(file => (
                                    <button

                                                    </div>

                                                    <div className="border-b-[2px] border-black p-1 flex flex-col flex-grow-[0.9] min-h-0 basis-0">
                                                        <div className="text-[#c00000] font-bold text-[13px] border-b-[1.5px] border-[#c00000] pb-0.5 mb-1 w-max shrink-0">2. 건강 및 환경에 대한 유해성·물리적 위험성</div>
                                                        <div className="w-full flex-grow min-h-0 overflow-hidden">
                                                            <div
                                                                contentEditable
                                                                suppressContentEditableWarning
                                                                onBlur={(e) => updateActiveFileData({ hazardsText: e.target.innerText })}
                                                                className="w-full h-auto p-0.5 text-[11px] leading-[1.3] font-medium text-black bg-transparent outline-none cursor-text break-words"
                                                                style={{ columnCount: 2, columnGap: '1rem', columnRule: '1px dashed #94a3b8', whiteSpace: 'pre-wrap', columnFill: 'balance' }}
                                                            >
                                                                {activeData.hazardsText}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="border-b-[2px] border-black p-1 flex flex-col flex-grow-[1.3] min-h-0 basis-0">
                                                        <div className="text-[#c00000] font-bold text-[13px] border-b-[1.5px] border-[#c00000] pb-0.5 mb-1 w-max shrink-0">3. 안전 및 보건상의 취급주의 사항</div>
                                                        <div className="w-full flex-grow min-h-0 overflow-hidden">
                                                            <div
                                                                contentEditable
                                                                suppressContentEditableWarning
                                                                onBlur={(e) => updateActiveFileData({ handlingText: e.target.innerText })}
                                                                className="w-full h-auto p-0.5 text-[11px] leading-[1.3] font-medium text-black bg-transparent outline-none cursor-text break-words"
                                                                style={{ columnCount: 2, columnGap: '1rem', columnRule: '1px dashed #94a3b8', whiteSpace: 'pre-wrap', columnFill: 'balance' }}
                                                            >
                                                                {activeData.handlingText}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="border-b-[2px] border-black p-1 shrink-0 h-auto">
                                                        <div className="text-[#c00000] font-bold text-[13px] border-b-[1.5px] border-[#c00000] pb-0.5 mb-1 w-max shrink-0">4. 적절한 보호구</div>
                                                        <div className="flex justify-center items-center gap-4 py-0.5 flex-wrap min-h-[50px]">
                                                            {activeData.selectedPPE && activeData.selectedPPE.length > 0 ? (
                                                                activeData.selectedPPE.map(ppeId => (
                                                                    <div key={ppeId} className="flex flex-col items-center gap-0.5">
                                                                        <div className="w-[42px] h-[42px]">{renderPPE(ppeId)}</div>
                                                                        <span className="font-bold text-[11px] text-center leading-tight whitespace-pre-wrap">{PPE_ICONS[ppeId].name.replace(' ', '\n')}</span>
                                                                    </div>
                                                                ))
                                                            ) : <span className="text-[11px] text-slate-400 font-bold">표시할 보호구 지시표지가 없습니다.</span>}
                                                        </div>
                                                        <div className="flex justify-center flex-wrap gap-1 mt-1 p-1 bg-slate-50 border border-slate-200 rounded-lg no-print">
                                                            {Object.keys(PPE_ICONS).map(id => (
                                                                <button key={id} onClick={() => togglePPE(id)} className={`px-1.5 py-0.5 text-[10px] rounded transition-all font-semibold ${activeData.selectedPPE?.includes(id) ? 'bg-[#0052cc] text-white shadow-sm' : 'bg-white border text-slate-600'}`}>
                                                                    {PPE_ICONS[id].name}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    <div className="p-1 flex flex-col flex-grow-[2.2] min-h-0 basis-0">
                                                        <div className="text-[#c00000] font-bold text-[13px] border-b-[1.5px] border-[#c00000] pb-0.5 mb-1 w-max shrink-0">5. 응급조치 요령 및 사고 시 대처방법</div>
                                                        <div className="flex flex-col flex-1 text-[11px] font-medium text-black border border-slate-300 min-h-0">
                                                            <div className="flex flex-1 border-b border-slate-200 min-h-0">
                                                                <div className="w-[20%] bg-slate-100 p-0.5 font-bold flex items-center justify-center text-center border-r border-slate-200 shrink-0">가. 눈에 들어갔을 때</div>
                                                                <textarea style={{ wordBreak: 'keep-all' }} value={activeData.firstAidData?.eye || ''} onChange={(e) => updateFirstAid('eye', e.target.value)} className="flex-1 h-full p-1.5 bg-transparent resize-none overflow-hidden leading-[1.4]" />
                                                            </div>
                                                            <div className="flex flex-1 border-b border-slate-200 min-h-0">
                                                                <div className="w-[20%] bg-slate-100 p-0.5 font-bold flex items-center justify-center text-center border-r border-slate-200 shrink-0">나. 피부에 접촉했을 때</div>
                                                                <textarea style={{ wordBreak: 'keep-all' }} value={activeData.firstAidData?.skin || ''} onChange={(e) => updateFirstAid('skin', e.target.value)} className="flex-1 h-full p-1.5 bg-transparent resize-none overflow-hidden leading-[1.4]" />
                                                            </div>
                                                            <div className="flex flex-1 border-b border-slate-200 min-h-0">
                                                                <div className="w-[20%] bg-slate-100 p-0.5 font-bold flex items-center justify-center text-center border-r border-slate-200 shrink-0">다. 흡입했을 때</div>
                                                                <textarea style={{ wordBreak: 'keep-all' }} value={activeData.firstAidData?.inhale || ''} onChange={(e) => updateFirstAid('inhale', e.target.value)} className="flex-1 h-full p-1.5 bg-transparent resize-none overflow-hidden leading-[1.4]" />
                                                            </div>
                                                            <div className="flex flex-1 border-b border-slate-200 min-h-0">
                                                                <div className="w-[20%] bg-slate-100 p-0.5 font-bold flex items-center justify-center text-center border-r border-slate-200 shrink-0">라. 먹었을 때</div>
                                                                <textarea style={{ wordBreak: 'keep-all' }} value={activeData.firstAidData?.ingest || ''} onChange={(e) => updateFirstAid('ingest', e.target.value)} className="flex-1 h-full p-1.5 bg-transparent resize-none overflow-hidden leading-[1.4]" />
                                                            </div>
                                                            <div className="flex flex-1 border-b border-slate-200 min-h-0">
                                                                <div className="w-[20%] bg-slate-100 p-0.5 font-bold flex items-center justify-center text-center border-r border-slate-200 shrink-0">마. 기타 의사 주의사항</div>
                                                                <textarea style={{ wordBreak: 'keep-all' }} value={activeData.firstAidData?.doctor || ''} onChange={(e) => updateFirstAid('doctor', e.target.value)} className="flex-1 h-full p-1.5 bg-transparent resize-none overflow-hidden leading-[1.4]" />
                                                            </div>
                                                            
                                                            <div className="flex flex-[1.5] min-h-0">
                                                                <div className="w-[20%] bg-slate-100 p-0.5 font-bold flex items-center justify-center text-center border-r border-slate-200 shrink-0">바. 사고 시 대처방법</div>
                                                                <div className="w-[80%] p-1 flex flex-col h-full overflow-hidden justify-center">
                                                                    <div className="flex gap-1 w-full flex-1 min-h-0">
                                                                        <span className="font-bold text-slate-800 shrink-0 mt-1 ml-1">-</span>
                                                                        <textarea style={{ wordBreak: 'keep-all' }} value={activeData.firstAidData?.extinguish || ''} onChange={(e) => updateFirstAid('extinguish', e.target.value)} className="w-full h-full p-0.5 bg-transparent resize-none leading-[1.3] font-semibold text-black overflow-hidden" />
                                                                    </div>
                                                                    <div className="flex gap-1 w-full flex-1 min-h-0">
                                                                        <span className="font-bold text-slate-800 shrink-0 mt-1 ml-1">-</span>
                                                                        <textarea style={{ wordBreak: 'keep-all' }} value={activeData.firstAidData?.leakResponse || ''} onChange={(e) => updateFirstAid('leakResponse', e.target.value)} className="w-full h-full p-0.5 bg-transparent resize-none leading-[1.3] font-semibold text-black overflow-hidden" />
                                                                    </div>
                                                                    <div className="flex gap-1 w-full shrink-0 h-[18px]">
                                                                        <span className="w-full h-full px-1 leading-none font-bold text-black">- 즉시 119 및 관계기관에 신고할 것</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                </div>
                                                
                                                {/* 회사 로고 업로드 및 렌더링 영역 */}
                                                <div 
                                                    className="w-full text-center mt-1.5 font-black text-[13px] tracking-widest text-slate-700 shrink-0 h-[28px] flex items-center justify-center cursor-pointer relative group border border-dashed border-transparent hover:border-slate-300 transition-colors"
                                                    onClick={() => logoInputRef.current.click()}
                                                    title="클릭하여 회사 로고 이미지를 업로드하세요"
                                                >
                                                    <input type="file" accept="image/*" ref={logoInputRef} onChange={handleLogoUpload} className="hidden" />
                                                    {companyLogo ? (
                                                        <img src={companyLogo} alt="회사로고" className="h-full object-contain" />
                                                    ) : (
                                                        <span className="opacity-40 group-hover:opacity-100 transition-opacity">회사로고 (클릭하여 이미지 등록)</span>
                                                    )}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="h-[297mm] flex flex-col items-center justify-center text-slate-400 space-y-4"><IconFileText size={48} className="opacity-30" /><p className="text-base font-medium">선택된 파일이 없습니다.</p></div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MSDSPlatform />);
    </script>
</body>
</html>
